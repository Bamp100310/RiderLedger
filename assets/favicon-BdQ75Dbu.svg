<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="180" y1="180" x2="330" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4"/>
  
  <!-- Speed lines -->
  <path d="M70 210 H140 M50 256 H160 M70 302 H130" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

  <!-- Motorcycle / Delivery Fast Icon -->
  <g transform="translate(60, 40)">
    <!-- Back wheel -->
    <circle cx="100" cy="300" r="50" stroke="#10b981" stroke-width="16" fill="#09131d"/>
    <circle cx="100" cy="300" r="22" fill="#10b981"/>
    
    <!-- Front wheel -->
    <circle cx="300" cy="300" r="50" stroke="#10b981" stroke-width="16" fill="#09131d"/>
    <circle cx="300" cy="300" r="22" fill="#10b981"/>
    
    <!-- Frame -->
    <path d="M100 300 L170 230 L250 230 L300 300" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M170 230 L200 150 L275 150" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M170 230 L230 300" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Delivery Backpack with Dollar / Stats -->
    <rect x="110" y="130" width="70" height="85" rx="14" fill="url(#boxGrad)"/>
    <path d="M145 145 V175 M145 185 V200" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M135 155 C135 150 155 150 155 160 C155 170 135 170 135 180 C135 190 155 190 155 185" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- Rider Helmet -->
    <circle cx="215" cy="115" r="26" fill="#38bdf8"/>
    <path d="M225 110 H240 C242 110 244 114 242 118 L235 125 H220 Z" fill="#0284c7"/>
  </g>
</svg>